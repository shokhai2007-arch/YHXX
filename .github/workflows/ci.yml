name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  POSTGRES_PASSWORD: changeme
  DATABASE_URL: postgresql+asyncpg://cyberleek:changeme@postgres:5432/cyberleek
  ENVIRONMENT: testing

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: python -m mypy --python-version 3.12 app/ engine/ solution.py run_submission.py evaluate.py

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cyberleek
          POSTGRES_USER: cyberleek
          POSTGRES_PASSWORD: changeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cyberleek -d cyberleek"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U cyberleek && break
            sleep 1
          done

      - name: Run tests (judge environment only)
        run: pytest tests/judge/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://cyberleek:changeme@localhost:5432/cyberleek
          UPLOAD_DIR: ${{ runner.temp }}/cyberleek/uploads
          OUTPUT_DIR: ${{ runner.temp }}/cyberleek/outputs
          ENVIRONMENT: testing

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cyberleek
          POSTGRES_USER: cyberleek
          POSTGRES_PASSWORD: changeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cyberleek -d cyberleek"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build development image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dev
          load: true
          tags: cyberleek/backend:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: cyberleek/backend:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test production image
        run: |
          docker run -d --name test-backend \
            --network host \
            -e DATABASE_URL=postgresql+asyncpg://cyberleek:changeme@localhost:5432/cyberleek \
            cyberleek/backend:prod
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health; then
              echo ""
              echo "Health check passed"
              docker stop test-backend
              docker rm test-backend
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed - container logs:"
          docker logs test-backend || true
          docker rm -f test-backend || true
          exit 1

  judge-test:
    name: Judge Environment Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install core dependencies
        run: |
          pip install opencv-python-headless==4.10.0.84 ffmpeg-python==0.2.0 PyYAML==6.0.1 "numpy<2.3"

      - name: Create test video folder
        run: |
          mkdir -p test_videos
          ffmpeg -f lavfi -i testsrc=duration=5:size=1280x720:rate=30 \
            -c:v libx264 -pix_fmt yuv420p test_videos/test_video.mp4 -y

      - name: Run judge entry point
        run: python run_submission.py --videos test_videos --out predictions.json

      - name: Validate output
        run: |
          python -c "
          import json
          with open('predictions.json') as f:
              data = json.load(f)
          assert 'team' in data, 'Output must have team field'
          assert 'videos' in data, 'Output must have videos field'
          valid_labels = ['accident', 'near_miss', 'red_light', 'wrong_way', 'illegal_u_turn',
                          'stopped_vehicle', 'jaywalking', 'failure_to_yield', 'illegal_turn',
                          'solid_line_crossing', 'stop_line', 'congestion', 'road_obstacle',
                          'fire_smoke']
          for vid, vdata in data['videos'].items():
            assert 'events' in vdata, f'Video {vid} must have events'
            assert 'risk' in vdata, f'Video {vid} must have risk'
            for item in vdata['events']:
              assert isinstance(item, list) and len(item) == 3, 'Each item must be [start, end, label]'
              assert isinstance(item[0], (int, float)), 'start_sec must be number'
              assert isinstance(item[1], (int, float)), 'end_sec must be number'
              assert isinstance(item[2], str), 'label must be string'
              assert item[0] < item[1], 'start_sec must be < end_sec'
              assert item[2] in valid_labels, f'Invalid label: {item[2]}'
          print('✓ Judge output validation passed')
          "

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build, judge-test]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "CI Pipeline Complete"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "Judge Test: ${{ needs.judge-test.result }}"