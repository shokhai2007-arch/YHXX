[project]
name = "cyberleek"
version = "1.0.0"
description = "CyberLeek Traffic Detection — WUIT Hackathon"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "CyberLeek Team", email = "cyberleek@example.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "opencv-python-headless==4.10.0.84",
    "ffmpeg-python==0.2.0",
    "PyYAML==6.0.1",
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "python-multipart==0.0.9",
    "alembic==1.12.0",
    "watchfiles==0.21.0",
    "asyncpg==0.29.0",
    "redis==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.0",
    "httpx==0.27.0",
    "ruff==0.4.0",
    "mypy==1.11.2",
]
celery = [
    "celery==5.3.6",
    "kombu==5.3.4",
]
prod = [
    "gunicorn==22.0.0",
]

[project.scripts]
cyberleek-judge = "run_submission:main"
cyberleek-api = "app.main:app"
cyberleek-pipeline = "engine.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "engine*"]

[tool.pytest.ini_options]
testpaths = ["tests/judge"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008", "UP037", "T201", "N806", "B007", "SIM201", "C401", "B904", "F841", "F821", "UP038", "SIM117"]
exclude = [".venv", "__pycache__", "data", "*.pdf", "tests/"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [".venv", "data", "__pycache__", "tests/"]

[[tool.mypy.overrides]]
module = ["yaml", "cv2", "cv2.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.models.*", "app.database", "app.config", "app.services.*", "app.utils.*"]
ignore_missing_imports = true
disable_error_code = ["attr-defined", "arg-type", "assignment", "return-value", "var-annotated", "union-attr", "call-arg", "misc", "name-defined", "index", "attr-defined", "import-untyped"]

[[tool.mypy.overrides]]
module = ["engine.pipeline", "evaluate", "run_submission", "solution"]
disable_error_code = ["attr-defined", "arg-type", "assignment", "return-value", "var-annotated", "union-attr", "call-arg", "import-untyped", "no-any-return", "operator", "misc"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"