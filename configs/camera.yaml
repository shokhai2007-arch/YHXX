# Camera Configuration — Scene Geometry
# Used by TrafficPipeline for lane/stop-line/crosswalk definitions
# All coordinates in pixels (origin top-left) for 1280x720 video
# Derived from frame analysis of samples/test_video.mp4

lanes:
  # Lane 1: leftmost lane (x: ~150-500) — incoming traffic
  - [[150, 720], [250, 450], [450, 450], [500, 720]]
  # Lane 2: center lane (x: ~480-800)
  - [[480, 720], [550, 450], [750, 450], [800, 720]]
  # Lane 3: rightmost lane (x: ~800-1100)
  - [[800, 720], [850, 450], [1050, 450], [1100, 720]]

stop_lines:
  # Stop line at intersection (y ≈ 455, spans all lanes)
  - [[150, 450], [1100, 450], [1100, 460], [150, 460]]

crosswalks:
  # Crosswalk just after stop line (y ≈ 460-540)
  - [[150, 460], [1100, 460], [1100, 540], [150, 540]]

roi:
  # Region of interest: exclude sky (y < 250)
  - [[0, 250], [1280, 250], [1280, 720], [0, 720]]

# Video properties
fps: 30.0
width: 1280
height: 720